<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Checkout - Velozes Internet</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" href="style.css" />
  <script src="https://js.stripe.com/v3/"></script>
</head>
<body class="checkout-page">
  <header class="topbar">
    <div class="container nav-wrap">
      <a href="index.html" class="brand"><div class="brand-mark"><span class="brand-dot"></span></div><div class="brand-text"><span class="brand-main">Velozes</span><span class="brand-sub">Internet</span></div></a>
      <nav class="main-nav"><a href="index.html">Voltar</a></nav>
    </div>
  </header>
  <main class="checkout-main">
    <div class="container checkout-wrap">
      <aside class="checkout-summary">
        <h2>Resumo do plano</h2>
        <div class="summary-card">
          <div class="summary-row"><span>Plano</span><strong id="plan-name">500 Mega</strong></div>
          <div class="summary-row"><span>Velocidade</span><strong id="plan-speed">500 Mbps</strong></div>
          <div class="summary-row"><span>Valor mensal</span><strong id="plan-price">R$ 99,99</strong></div>
          <div class="summary-divider"></div>
          <div class="summary-total"><span>Total</span><strong id="plan-total">R$ 99,99</strong></div>
        </div>
      </aside>
      <section class="checkout-form-box">
        <h1>Finalizar Assinatura</h1>
        <form id="payment-form">
          <div class="form-section"><h3>Dados pessoais</h3><div class="field-group"><label for="name">Nome completo</label><input type="text" id="name" name="name" placeholder="Seu nome" required /></div><div class="field-group"><label for="email">E-mail</label><input type="email" id="email" name="email" placeholder="seu@email.com" required /></div><div class="field-group"><label for="phone">Telefone</label><input type="tel" id="phone" name="phone" placeholder="(32) 99999-9999" required /></div></div>
          <div class="form-section"><h3>Endereço</h3><div class="field-group"><label for="address">Rua</label><input type="text" id="address" name="address" placeholder="Av. dos Andradas" required /></div><div class="row-fields"><div class="field-group"><label for="number">Número</label><input type="text" id="number" name="number" placeholder="340" required /></div><div class="field-group"><label for="city">Cidade</label><input type="text" id="city" name="city" placeholder="Juiz de Fora" required /></div></div><div class="row-fields"><div class="field-group"><label for="state">Estado</label><input type="text" id="state" name="state" placeholder="MG" required /></div><div class="field-group"><label for="cep">CEP</label><input type="text" id="cep" name="cep" placeholder="36036-000" required /></div></div></div>
          <div class="form-section"><h3>Pagamento</h3><div class="field-group"><label>Dados do cartão</label><div id="card-element" class="stripe-card"></div><div id="card-errors" class="card-errors"></div></div></div>
          <label class="checkbox-wrap"><input type="checkbox" required /><span>Concordo com os <a href="#">Termos de Uso</a> e <a href="#">Política de Privacidade</a>.</span></label>
          <button type="submit" class="submit-btn">Confirmar pagamento</button>
        </form>
      </section>
    </div>
  </main>
  <script>
    const plans={500:{name:'500 Mega',speed:'500 Mbps',price:99.99},700:{name:'700 Mega',speed:'700 Mbps',price:119.99},1000:{name:'1 Giga',speed:'1 Gbps',price:129.99}};const params=new URLSearchParams(window.location.search);const planKey=params.get('plan')||'500';const selectedPlan=plans[planKey]||plans[500];document.getElementById('plan-name').textContent=selectedPlan.name;document.getElementById('plan-speed').textContent=selectedPlan.speed;document.getElementById('plan-price').textContent=`R$ ${selectedPlan.price.toFixed(2).replace('.',',')}`;document.getElementById('plan-total').textContent=`R$ ${selectedPlan.price.toFixed(2).replace('.',',')}`;
  </script>
</body>
</html>
